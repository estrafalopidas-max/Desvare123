    <!-- Google Fonts: Barlow Condensed (Display), Plus Jakarta Sans (Body), JetBrains Mono (Tabular Data) -->

    <!-- Google Analytics 4 (GA4) - Medición de Conversiones Reales Desvares 123 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DESVARES123"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      window.__eventosConversionGA4 = window.__eventosConversionGA4 || [];
      function gtag() {
        window.dataLayer.push(arguments);
      }
      window.gtag = gtag;
      gtag('js', new Date());
      gtag('config', 'G-DESVARES123', {
        send_page_view: true,
        currency: 'COP'
      });

      // Seguimiento personalizado de conversiones para el botón 'Solicitar Rescate Ahora'
      window.registrarConversionRescate = function (detalles) {
        var parametrosEvento = Object.assign(
          {
            event_category: 'conversion_rescate',
            event_label: 'Solicitar Rescate Ahora',
            button_text: 'Solicitar Rescate Ahora',
            ubicacion_boton: 'navbar_principal',
            servicio_id: 'asistencia_inmediata',
            municipio_zona: 'valle_de_aburra',
            canal_contacto: 'formulario_web',
            currency: 'COP',
            value: 1
          },
          detalles || {}
        );
        window.__eventosConversionGA4.push({
          event: 'solicitar_rescate_ahora',
          params: parametrosEvento,
          timestamp: new Date().toISOString()
        });
        gtag('event', 'solicitar_rescate_ahora', parametrosEvento);
      };

      document.addEventListener('click', function (e) {
        var elemento =
          e.target && e.target.closest
            ? e.target.closest('[data-ga-conversion="solicitar-rescate-ahora"]')
            : null;
        if (!elemento) return;

        window.registrarConversionRescate({
          event_label:
            elemento.getAttribute('data-ga-label') ||
            (elemento.textContent ? elemento.textContent.trim() : 'Solicitar Rescate Ahora'),
          ubicacion_boton: elemento.getAttribute('data-ga-location') || 'cta_principal',
          servicio_id: elemento.getAttribute('data-ga-service') || 'la-moto-no-prende',
          municipio_zona: elemento.getAttribute('data-ga-zone') || 'itagui',
          canal_contacto: elemento.getAttribute('data-ga-channel') || 'formulario_web'
        });
      });
    </script>
